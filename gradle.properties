## ============================================================
## Gradle properties for kotlin-katas
## ============================================================

# Allow Gradle to auto-download JDK 21 toolchain if not present
org.gradle.java.installations.auto-download=true

# Use parallel builds when possible
org.gradle.parallel=true

# Enable Gradle daemon (default, but explicit)
org.gradle.daemon=true

# Allocate more memory to Gradle (optional, helps on larger projects)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin-specific
kotlin.code.style=official
